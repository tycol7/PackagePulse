<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign In | PackagePulse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts: Roboto & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  
  <!-- Material Theme -->
  <link rel="stylesheet" href="/static/css/material-theme.css">
</head>
<body>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa;">
  <div style="background: #ffffff; border: 1px solid #dadce0; border-radius: 16px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 4px 16px rgba(60,64,67,0.1); text-align: center;">
    
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: #e8f0fe; border-radius: 50%; margin-bottom: 16px;">
      <span class="material-symbols-outlined" style="font-size: 32px; color: #1a73e8;">local_shipping</span>
    </div>

    <h1 style="font-size: 24px; font-weight: 700; color: #202124; margin: 0 0 6px 0;">PackagePulse</h1>
    <p style="color: #5f6368; font-size: 14px; margin: 0 0 28px 0;">Autonomous Logistics Agent on Google Cloud</p>

    <div style="margin-bottom: 24px;">
      <a href="/auth/google" style="text-decoration: none;">
        <button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; background: #ffffff; border: 1px solid #dadce0; border-radius: 24px; padding: 10px 16px; font-size: 15px; font-weight: 500; color: #3c4043; cursor: pointer; transition: background 0.2s, box-shadow 0.2s;"
                onmouseover="this.style.background='#f8fafd'; this.style.boxShadow='0 1px 3px rgba(60,64,67,0.2)';"
                onmouseout="this.style.background='#ffffff'; this.style.boxShadow='none';">
          <!-- Google 'G' SVG Logo -->
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>
      </a>
    </div>

    <div style="background: #f1f3f4; border-radius: 8px; padding: 12px 14px; font-size: 12px; color: #5f6368; line-height: 1.4; text-align: left; display: flex; gap: 8px; align-items: flex-start;">
      <span class="material-symbols-outlined" style="font-size: 18px; color: #1a73e8; flex-shrink: 0; margin-top: 1px;">verified_user</span>
      <div>
        <strong>Corporate SSO Required:</strong> Access is authenticated via Google Accounts and strictly restricted to verified <code>@google.com</code> identities.
      </div>
    </div>

    <div style="margin-top: 24px; font-size: 12px; color: #80868b;">
      Powered by Google Cloud Run &bull; Agent Platform &bull; Cloud Firestore
    </div>

  </div>
</div>
</body>
</html>
