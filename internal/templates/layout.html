{{define "layout.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{block "title" .}}PackagePulse | Google Cloud AI Agent{{end}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts: Roboto & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  
  <!-- Material Theme -->
  <link rel="stylesheet" href="/static/css/material-theme.css">
</head>
<body>
  {{block "content" .}}{{end}}

  <!-- Modal Container for HTMX Swaps -->
  <div id="modal-container"></div>

  <!-- Global Snackbar Toast -->
  <div id="toast-snackbar" class="snackbar"></div>

  <script>
    function showSnackbar(message) {
      const sb = document.getElementById("toast-snackbar");
      if (!sb) return;
      sb.textContent = message;
      sb.style.display = "block";
      setTimeout(() => {
        sb.style.display = "none";
      }, 4000);
    }

    document.addEventListener("htmx:afterRequest", function(evt) {
      const triggers = evt.detail.xhr.getResponseHeader("HX-Trigger");
      if (triggers) {
        try {
          const parsed = JSON.parse(triggers);
          if (parsed.showToast) {
            showSnackbar(parsed.showToast);
          }
        } catch(e) {}
      }
    });

    function closeModal() {
      const container = document.getElementById("modal-container");
      if (container) container.innerHTML = "";
    }
  </script>
</body>
</html>
{{end}}
