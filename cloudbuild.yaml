steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/package-tracker:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/agents/package-tracker:latest'
      - '.'
images:
  - 'gcr.io/$PROJECT_ID/package-tracker:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/agents/package-tracker:latest'
options:
  logging: CLOUD_LOGGING_ONLY
